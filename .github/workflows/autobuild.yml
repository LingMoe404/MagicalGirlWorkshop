# ==========================================
# 🌟 魔法少女工坊 (MagicalGirlWorkshop) 云端炼成阵 🌟
# 缔造者/最高统帅：泠萌404 (Master)
# ==========================================
name: AutoBuild # 自动炼成阵列：工坊云端运转协议

on:
  workflow_dispatch: # 接受主人的无条件强制召唤 (手动触发)
  push:              # 观测到世界线的变动 (代码推送) 时自动响应
    paths-ignore:
      # 结界过滤规则：忽略以下微小的魔力扰动（文档变动不引发炼成，节约云端算力）
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

concurrency:
  # 因果律收束：一旦主人下达了新的指令，立刻斩断同一分支上正在进行的旧有仪式
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 赋予结界最基础的物质读取权限

jobs:
  build-windows:
    runs-on: windows-latest # 构筑基础界域：将祭坛建立在最新世代的 Windows 环境上
    timeout-minutes: 90     # 设定魔力维持的绝对极限时间，防止仪式失控

    steps:
      - name: Checkout # 步骤一：从虚空 (GitHub) 中具现化主人的源代码圣遗物
        uses: actions/checkout@v7

      - name: Setup uv and Python 3.12 # 步骤二：铺设星光回路，注入纯度为 3.12 的 Python 魔力
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true # 开启基础魔力回路缓存

      - name: Cache Nuitka Compiler Cache # 步骤三：回收过往炼成产生的魔力残渣 (C++编译缓存)，极大加速下一次奇迹的降临！
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Sync project dependencies # 步骤四：签订契约，同步召唤工坊所需的所有使魔 (第三方依赖库)
        run: uv sync --locked --no-dev

      - name: Resolve application version # 步骤五：读取版本真名，统一铭刻到便携版与安装版
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = uv run --locked python -c "from config import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "无法从 config.py 读取应用版本"
          }

          $version = $version.Trim()
          "MGW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "✨ 当前炼成版本：$version"

      - name: Build standalone application # 步骤六：构筑无需运行时解包的完整程序目录
        run: >
          uv run --locked --with nuitka python -m nuitka main.py
          --standalone
          --windows-console-mode=disable
          --enable-plugin=pyside6
          --assume-yes-for-downloads
          --windows-icon-from-ico=logo.ico
          --include-data-file=logo.ico=logo.ico
          --include-data-file=LingMoe404.ico=LingMoe404.ico
          --include-package=i18n
          --output-dir=build/nuitka
          --output-filename=MagicalGirlWorkshop.exe

      - name: Prepare shared distribution # 步骤七：合并 standalone 运行目录与外置工具链
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = "build/nuitka/main.dist"
          $tools = "tools"
          $stage = "build/package/MagicalGirlWorkshop"

          if (!(Test-Path $dist)) { throw "炼成失败：找不到 standalone 目录 $dist" }
          if (!(Test-Path $tools)) { throw "炼成失败：找不到附属法器 $tools" }

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Path $stage -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction Stop

          Copy-Item -Path "$dist\*" -Destination $stage -Recurse -Force
          Copy-Item -LiteralPath $tools -Destination (Join-Path $stage "tools") -Recurse -Force

          $stagedExe = Join-Path $stage "MagicalGirlWorkshop.exe"
          $stagedTools = Join-Path $stage "tools"
          if (!(Test-Path $stagedExe)) { throw "暂存失败：找不到 $stagedExe" }
          if (!(Test-Path $stagedTools)) { throw "暂存失败：找不到 $stagedTools" }

      - name: Ensure packaging tools are available # 步骤八：召唤 7-Zip 与 Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          7z i | Select-Object -First 5

          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) {
            $isccPath = $iscc.Source
          } else {
            choco install innosetup -y --no-progress
            $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $isccPath)) {
            throw "无法找到 Inno Setup 编译器：$isccPath"
          }

          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable archive # 步骤九：将共享运行目录封装为便携版
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = "build/package/MagicalGirlWorkshop"
          $archiveName = "MagicalGirlWorkshop-v$($env:MGW_VERSION)-Portable.7z"
          $archive = Join-Path "build/package" $archiveName

          if (Test-Path $archive) { Remove-Item $archive -Force }
          Push-Location $stage
          7z a -t7z "..\$archiveName" ".\*" -m0=lzma2 -mx=9 -mfb=273 -md=128m -ms=on -mmt=on
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { throw "便携版压缩失败，错误码: $exitCode" }
          if (!(Test-Path $archive)) { throw "未生成便携版：$archive" }

      - name: Build installer # 步骤十：使用同一份共享运行目录生成用户级安装版
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = (Resolve-Path "build/package/MagicalGirlWorkshop").Path
          $outputDir = (Resolve-Path "build/package").Path
          $script = "installer/MagicalGirlWorkshop.iss"

          & "$env:ISCC_PATH" `
            "/DMyAppVersion=$env:MGW_VERSION" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            $script

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup 编译失败，错误码: $LASTEXITCODE"
          }

          $setup = Join-Path $outputDir "MagicalGirlWorkshop-v$($env:MGW_VERSION)-Setup.exe"
          if (!(Test-Path $setup)) { throw "未生成安装版：$setup" }

      - name: Show artifact info # 步骤十一：鉴定便携版与安装版
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "build/package/MagicalGirlWorkshop-v$($env:MGW_VERSION)-Portable.7z"
          $setup = "build/package/MagicalGirlWorkshop-v$($env:MGW_VERSION)-Setup.exe"

          foreach ($artifact in @($archive, $setup)) {
            if (!(Test-Path $artifact)) { throw "鉴定失败：找不到 $artifact" }
            $sizeMB = [math]::Round((Get-Item $artifact).Length / 1MB, 2)
            Write-Host "✨ 产物：$artifact"
            Write-Host "✨ 体积：${sizeMB} MB"
          }

      - name: Upload portable artifact # 步骤十二：上传免安装便携版
        uses: actions/upload-artifact@v7
        with:
          name: MagicalGirlWorkshop-Portable
          path: build/package/*-Portable.7z
          if-no-files-found: error

      - name: Upload installer artifact # 步骤十三：上传用户级安装版
        uses: actions/upload-artifact@v7
        with:
          name: MagicalGirlWorkshop-Installer
          path: build/package/*-Setup.exe
          if-no-files-found: error
